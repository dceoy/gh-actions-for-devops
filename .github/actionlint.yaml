---
self-hosted-runner:
  labels:
    - ubuntu-slim
paths:
  .github/workflows/gcloud-infra-manager-deployments.yml:
    ignore:
      - 'maximum number of inputs for "workflow_dispatch" event is 10'
  .github/workflows/repository-security-scan.yml:
    # GitHub added these job identity properties after actionlint's current
    # expression schema. Remove this compatibility exclusion once supported.
    ignore:
      - 'property "workflow_(ref|repository|sha)" is not defined in object type'
