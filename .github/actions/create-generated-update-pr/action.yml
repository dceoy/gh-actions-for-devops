---
name: Create a generated file update pull request
description: >
  Stage caller-scoped generated file changes, commit and push them to a
  deterministic branch, and create or update that branch's pull request.
inputs:
  paths:
    description: Newline-separated pathspecs of generated files to stage; nothing outside these pathspecs is ever staged
    required: true
  branch:
    description: Deterministic branch name to create or reset
    required: true
  base:
    description: Base branch for the pull request
    required: false
    default: main
  commit-message:
    description: Commit message for the staged changes
    required: false
    default: "Update generated files"
  title:
    description: Pull request title
    required: false
    default: "Update generated files"
  body:
    description: Pull request body
    required: false
    default: "Automated update of generated files."
  labels:
    description: Comma-separated labels to apply to the pull request
    required: false
    default: ""
  draft:
    description: Open the pull request as a draft
    required: false
    default: "false"
  git-user-name:
    description: Git author name used for the commit
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: Git author email used for the commit
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
outputs:
  changed:
    description: Whether any scoped files changed ("true" or "false")
    value: ${{ steps.stage.outputs.changed }}
  branch:
    description: The branch the changes were pushed to
    value: ${{ inputs.branch }}
  commit-sha:
    description: The SHA of the commit pushed to the branch, empty when nothing changed
    value: ${{ steps.commit.outputs.commit-sha }}
  pr-number:
    description: The pull request number, empty when nothing changed
    value: ${{ steps.pr.outputs.pr-number }}
  pr-url:
    description: The pull request URL, empty when nothing changed
    value: ${{ steps.pr.outputs.pr-url }}
runs:
  using: composite
  steps:
    - name: Stage scoped changes
      id: stage
      shell: bash -euo pipefail {0}
      env:
        PATHS: ${{ inputs.paths }}
      run: ${{ github.action_path }}/scripts/stage-changes.sh
    - name: Create or reset the update branch and commit
      id: commit
      if: steps.stage.outputs.changed == 'true'
      shell: bash -euo pipefail {0}
      env:
        BRANCH: ${{ inputs.branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        PATHS: ${{ inputs.paths }}
      run: ${{ github.action_path }}/scripts/commit-and-push.sh
    - name: Create or update the pull request
      id: pr
      if: steps.stage.outputs.changed == 'true'
      shell: bash -euo pipefail {0}
      env:
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        LABELS: ${{ inputs.labels }}
        DRAFT: ${{ inputs.draft }}
      run: ${{ github.action_path }}/scripts/create-or-update-pr.sh
