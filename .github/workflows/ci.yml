---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint
          - analyze
          - release
          - update
        description: Choose the workflow to run
        default: lint
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: ./.github/workflows/shell-lint.yml
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: ./.github/workflows/bats-test.yml
    with:
      search-path: .
      test-paths: |
        .github/scripts/tests/update-readme.bats
      setup-run: ./.github/scripts/install-yq-gomplate.sh
      go-tools-path: .github/tools
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      go-version: stable
      python-version: 3.x
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'analyze')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/github-codeql-analysis.yml
    with:
      language: >
        ["actions"]
  github-release:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      create-new-tag: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  github-major-version-tag:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    needs:
      - github-release
    permissions:
      contents: write
    uses: ./.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - shell-lint
      - bats-test
      - github-actions-lint-and-scan
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: ./.github/workflows/dependabot-auto-merge.yml
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  markdown-format-and-pr:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/markdown-format-and-pr.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  update-readme-md:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
    runs-on: ubuntu-slim
    env:
      # renovate: datasource=npm depName=prettier
      PRETTIER_VERSION: "3.9.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24.18.0"
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: .github/tools/go.mod
          cache-dependency-path: .github/tools/go.sum
      - name: Install yq and gomplate
        run: ./.github/scripts/install-yq-gomplate.sh
      - name: Install Prettier
        env:
          PRETTIER_VERSION: ${{ env.PRETTIER_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] installs pinned Prettier tool
          [[ "${PRETTIER_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid PRETTIER_VERSION"; exit 1; }
          tool_dir="${HOME}/.cache/gh-actions-for-devops/prettier"
          if [[ ! -x "${tool_dir}/node_modules/.bin/prettier" ]]; then
            npm install --prefix "${tool_dir}" "prettier@${PRETTIER_VERSION}"
          fi
          echo "${tool_dir}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Update README.md
        run: |
          ./.github/scripts/update-readme.sh
      - name: Commit and push the changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321  # v10.0.0
        with:
          add: ./README.md
          message: Update README.md
          push: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
