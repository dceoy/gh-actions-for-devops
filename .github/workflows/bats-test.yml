---
name: Test for Bats
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Bats test files
        default: .
      test-paths:
        required: false
        type: string
        description: Newline-separated Bats test file names or pathspecs passed to git ls-files
        default: |
          *.bats
      setup-run:
        required: false
        type: string
        description: Shell command to run after checkout, before installing Bats, to provision runtime dependencies the tests require
        default: ""
      go-tools-path:
        required: false
        type: string
        description: Path to a directory containing a go.mod/go.sum used to install Go via actions/setup-go before running the setup command
        default: ""
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Go
        if: inputs.go-tools-path != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: ${{ inputs.go-tools-path }}/go.mod
          cache-dependency-path: ${{ inputs.go-tools-path }}/go.sum
      - name: Run setup command
        if: inputs.setup-run != ''
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: |
          setup_script="$(mktemp)"
          printf '%s\n' "${SETUP_RUN}" > "${setup_script}"
          chmod +x "${setup_script}"
          "${setup_script}"
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
      - name: Run Bats tests
        working-directory: ${{ inputs.search-path }}
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${TEST_PATHS}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::test-paths input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t bats
