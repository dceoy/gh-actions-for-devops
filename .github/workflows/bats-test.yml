---
name: Test for Bats
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Bats test files
        default: .
      test-paths:
        required: false
        type: string
        description: Newline-separated Bats test file names or pathspecs passed to git ls-files
        default: |
          *.bats
      setup-run:
        required: false
        type: string
        description: Shell command to run after checkout, before installing Bats, to provision runtime dependencies the tests require
        default: ""
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run setup command
        if: inputs.setup-run != ''
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: |
          setup_script="$(mktemp)"
          printf '%s\n' "${SETUP_RUN}" > "${setup_script}"
          chmod +x "${setup_script}"
          "${setup_script}"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: latest
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: latest
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
      - name: Run Bats tests
        working-directory: ${{ inputs.search-path }}
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${TEST_PATHS}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::test-paths input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t bats
