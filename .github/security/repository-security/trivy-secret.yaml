# Use Trivy's complete built-in secret rule set without target-controlled
# exclusions. Keep this list synchronized with the pinned Trivy version.
rules: []
allow-rules: []
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log
skip-patterns: []
